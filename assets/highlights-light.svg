<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 100" width="920" height="100" role="img" aria-label="Highlights: real-time factor 0.037, about 300 MB peak memory, 17.50% DER, no speaker cap">
<rect x="0" y="0" width="218" height="100" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<text x="109" y="48" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="38" font-weight="700" fill="#2a78d6">0.037</text>
<text x="109" y="74" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2328">real-time factor</text>
<text x="109" y="90" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6e7781">~16x vs PyTorch CPU</text>
<rect x="233" y="0" width="218" height="100" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<text x="342" y="48" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="38" font-weight="700" fill="#2a78d6">~300 MB</text>
<text x="342" y="74" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2328">peak memory</text>
<text x="342" y="90" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6e7781">no Python at inference</text>
<rect x="466" y="0" width="218" height="100" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<text x="575" y="48" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="38" font-weight="700" fill="#2a78d6">17.50%</text>
<text x="575" y="74" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2328">DER on AMI EN2002a</text>
<text x="575" y="90" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6e7781">large model; 21.16% base</text>
<rect x="699" y="0" width="218" height="100" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<text x="808" y="48" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="38" font-weight="700" fill="#2a78d6">∞</text>
<text x="808" y="74" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1f2328">speakers</text>
<text x="808" y="90" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6e7781">no cap</text>
