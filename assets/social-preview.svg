  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26">
    <rect x="100" y="440" width="300" height="56" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="250" y="476" text-anchor="middle" fill="#c9d1d9">RTF <tspan fill="#2dd4bf" font-weight="700">0.037</tspan> on M2 Pro</text>
