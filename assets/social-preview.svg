  <text x="100" y="250" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="72" font-weight="700" fill="#e6edf3">diarizen<tspan fill="#2dd4bf">-apple</tspan></text>
  <text x="104" y="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" fill="#8b949e">On-device speaker diarization for Apple Silicon</text>

  <g>
    <rect x="100"  y="356" width="232" height="26" rx="6" fill="#2dd4bf"/>
    <rect x="340"  y="356" width="150" height="26" rx="6" fill="#fbbf24"/>
    <rect x="498"  y="356" width="118" height="26" rx="6" fill="#fb7185"/>
