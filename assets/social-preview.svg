  <text x="104" y="575" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" fill="#6e7681">CoreML + native Swift, a port of DiariZen (WavLM)</text>
