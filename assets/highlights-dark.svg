<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 100" width="920" height="100" role="img" aria-label="Highlights: real-time factor 0.037, about 300 MB peak memory, 15.8% corpus DER, no speaker cap">
<rect x="0" y="0" width="218" height="100" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="109" y="48" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="38" font-weight="700" fill="#3987e5">0.037</text>
<text x="109" y="74" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#e6edf3">real-time factor</text>
<text x="109" y="90" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">~16x vs PyTorch CPU</text>
<rect x="233" y="0" width="218" height="100" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="342" y="48" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="38" font-weight="700" fill="#3987e5">~300 MB</text>
<text x="342" y="74" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#e6edf3">peak memory</text>
<text x="342" y="90" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">no Python at inference</text>
<rect x="466" y="0" width="218" height="100" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="575" y="48" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="38" font-weight="700" fill="#3987e5">15.8%</text>
<text x="575" y="74" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#e6edf3">DER · AMI-SDM corpus</text>
<text x="575" y="90" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">base; large 13.76%</text>
<rect x="699" y="0" width="218" height="100" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="808" y="48" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="38" font-weight="700" fill="#3987e5">∞</text>
<text x="808" y="74" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#e6edf3">speakers</text>
<text x="808" y="90" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">no cap</text>
</svg>
